name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Valir
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

    - type: dropdown
      id: package
      attributes:
          label: Affected Package
          description: Which Valir package are you using?
          options:
              - Valir.Abstractions
              - Valir.Core
              - Valir.Redis
              - Valir.AspNet
              - Valir.EntityFrameworkCore
              - Valir.Brokers.Kafka
              - Valir.Brokers.RabbitMQ
              - Valir.Brokers.AzureSB
              - Multiple packages
              - Not sure
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: Package Version
          description: What version of the package are you using?
          placeholder: "1.0.0"
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: Bug Description
          description: A clear and concise description of what the bug is.
          placeholder: Describe the bug...
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to Reproduce
          description: Steps to reproduce the behavior
          placeholder: |
              1. Configure Valir with...
              2. Enqueue a job with...
              3. Worker processes...
              4. See error...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: What you expected to happen
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual Behavior
          description: What actually happened
      validations:
          required: true

    - type: textarea
      id: minimal-reproduction
      attributes:
          label: Minimal Reproduction Code
          description: If possible, provide a minimal code sample that reproduces the issue
          render: csharp
          placeholder: |
              // Your code here
              var queue = services.GetRequiredService<IJobQueue>();
              await queue.EnqueueAsync("test", payload);

    - type: dropdown
      id: dotnet-version
      attributes:
          label: .NET Version
          options:
              - .NET 10
              - .NET 9
              - .NET 8
              - Other
      validations:
          required: true

    - type: dropdown
      id: redis-version
      attributes:
          label: Redis Version
          options:
              - Redis 7.x
              - Redis 6.x
              - Redis 5.x
              - Redis Stack
              - Azure Cache for Redis
              - AWS ElastiCache
              - Other/Unknown
      validations:
          required: true

    - type: dropdown
      id: os
      attributes:
          label: Operating System
          options:
              - Linux (Ubuntu/Debian)
              - Linux (RHEL/CentOS)
              - Windows
              - macOS
              - Docker/Kubernetes
              - Other
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Logs / Error Messages
          description: Paste any relevant logs or error messages
          render: shell
          placeholder: |
              Exception: ...
              Stack trace: ...

    - type: checkboxes
      id: checklist
      attributes:
          label: Pre-submission Checklist
          options:
              - label: I have searched existing issues to ensure this bug hasn't been reported
                required: true
              - label: I have tested with the latest version of the package
                required: false
              - label: I can provide a reproduction repository if needed
                required: false
