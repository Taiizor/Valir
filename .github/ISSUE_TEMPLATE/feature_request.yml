name: ✨ Feature Request
description: Suggest a new feature or enhancement for Valir
title: "[FEATURE]: "
labels: ["enhancement", "needs-triage"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for suggesting a feature! Please provide as much detail as possible to help us understand your request.

    - type: dropdown
      id: feature-area
      attributes:
          label: Feature Area
          description: Which area does this feature relate to?
          options:
              - Job Queue (enqueue, claim, complete)
              - Worker Runtime (processing, concurrency)
              - Event Bus (Kafka, RabbitMQ, Azure SB)
              - Transactional Outbox
              - Distributed Locks
              - Rate Limiting
              - Retry Policies
              - Observability (OpenTelemetry, logging)
              - ASP.NET Core Integration
              - Configuration / Options
              - CLI / TUI
              - Documentation
              - Other
      validations:
          required: true

    - type: textarea
      id: problem
      attributes:
          label: Problem Statement
          description: Describe the problem this feature would solve. What are you trying to accomplish?
          placeholder: "I'm always frustrated when..."
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed Solution
          description: Describe your proposed solution in detail
          placeholder: "I would like to be able to..."
      validations:
          required: true

    - type: textarea
      id: api-design
      attributes:
          label: API Design (Optional)
          description: If you have ideas about how the API should look, please share
          render: csharp
          placeholder: |
              // Example API design
              await queue.EnqueueAsync("job-type", payload, new EnqueueOptions
              {
                  YourNewOption = "value"
              });

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives Considered
          description: Describe any alternative solutions you've considered
          placeholder: "I've also considered..."

    - type: textarea
      id: use-case
      attributes:
          label: Real-World Use Case
          description: Describe a specific, real-world scenario where you would use this feature
          placeholder: "In our production system, we need to..."
      validations:
          required: true

    - type: dropdown
      id: priority
      attributes:
          label: Priority
          description: How important is this feature to you?
          options:
              - Nice to have
              - Would significantly improve my workflow
              - Blocking adoption of Valir
      validations:
          required: true

    - type: checkboxes
      id: contributions
      attributes:
          label: Contribution
          description: Would you be willing to help with this feature?
          options:
              - label: I would be willing to submit a PR for this feature
                required: false
              - label: I would be willing to test beta/preview implementations
                required: false

    - type: checkboxes
      id: checklist
      attributes:
          label: Pre-submission Checklist
          options:
              - label: I have searched existing issues to ensure this feature hasn't been requested
                required: true
              - label: I have checked the roadmap/documentation for planned features
                required: false
