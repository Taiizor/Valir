name: Sync Labels

on:
    push:
        branches: [develop]
        paths:
            - ".github/labels.yml"
    workflow_dispatch: # Manual trigger

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - uses: actions/checkout@v7

            - name: Sync labels
              uses: EndBug/label-sync@v2
              with:
                  config-file: .github/labels.yml
                  delete-other-labels: false
                  dry-run: false
                  token: ${{ secrets.GITHUB_TOKEN }}
